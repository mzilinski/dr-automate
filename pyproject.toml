[project]
name = "dr-automate"
version = "0.5.0"
description = "Automatisierte Generierung von Dienstreise-Anträgen als PDF"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-wtf>=1.2.1",
    "flask-limiter>=3.5.0",
    "flask-mail>=0.10.0",
    "gunicorn>=23.0.0",
    "pillow>=12.1.0",
    "pydantic>=2.6.0",
    "pypdf>=6.6.0",
    "reportlab>=4.4.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "markdown>=3.7",
    "bleach>=6.2.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]

# Es ist eine Flask-App, keine Bibliothek — nur die Python-Module ins Wheel,
# nichts aus forms/ oder templates/ versuchen zu packen. Das Image startet
# aus /app (COPY . /app); die Liste dient den Paket-Metadaten (Version).
[tool.setuptools]
py-modules = [
    "abrechnung_calc", "ai_extract", "api_keys", "api_models", "api_openapi", "api_v1", "app", "auth",
    "crypto", "db", "extensions", "generator", "generator_abrechnung", "ki_kontext", "models", "models_db",
    "nrkvo_rates", "paperless_sync", "pdf_text", "rotate_keys", "routing", "services",
]

